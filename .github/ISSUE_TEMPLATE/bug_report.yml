name: Bug report
description: Report a reproducible problem with the app or widget
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Never attach `Config/Local.xcconfig`, `state_5.sqlite`, App Group snapshots, credentials, signing files, or unredacted logs. Replace real project names and local paths with neutral placeholders.

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Use the compact version shown in the menu or widget, for example v1.0.0 (3).
      placeholder: v1.0.0 (3)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include macOS version, Mac architecture, Xcode version, and Codex CLI version.
      placeholder: macOS version; Apple silicon or Intel; Xcode version; codex version
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and any user-visible error after removing private data.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, signing details, account usage, real project names, local paths, machine identifiers, databases, snapshots, and unredacted logs.
          required: true
