name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem first. Remember that Codex account methods and local state schemas are unstable implementation interfaces.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be improved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, including the widget size if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This request does not require uploading project attribution or scanning project directory contents.
          required: true
